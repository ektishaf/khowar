<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <meta name="title" content="Khowar Web Editor & Content Publisher">
    <meta name="description" content="Compose authentic Khowar content using custom font glyphs, insert specialized PUA characters, and generate embed codes for external websites.">
    <meta name="keywords" content="Khowar, Chitral, Khowar editor, Khowar font, Khowar glyphs, custom font publisher">
    <meta name="author" content="Open Khowar Project">
    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="css/style.css">
    <style>
        .editor-wrapper {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .toolbar-group {
            margin-bottom: 20px;
        }

        .toolbar-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .glyph-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
        }

        .glyph-btn {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            min-width: 42px;
            height: 42px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glyph-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        textarea {
            width: 100%;
            height: 220px;
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 1.5rem;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .output-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #38bdf8;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 15px;
            display: none;
        }

        .output-title {
            font-weight: 600;
            margin-top: 25px;
            display: none;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<header>
    <div class="brand">Khowar</div>
    <nav>
        <a href="index.html" style="color: var(--accent); text-decoration: none; font-weight: 600; padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg);">Translator</a>
        <a href="dictionary.html" style="color: var(--accent); text-decoration: none; font-weight: 600; padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); margin-left: 10px;">Dictionary</a>
    </nav>
</header>

<div class="editor-wrapper">
    <div class="card">
        <h2>Khowar Editor</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Compose content in Khowar and then generate an embed code to publish Khowar on external websites.</p>

        <!-- Writing Area -->
        <textarea id="editorInput" class="khowar-font" placeholder="Type or click glyph buttons above to compose..."></textarea>

        <!-- Dynamic Glyph Toolbars (Powered by glyphs.js) -->
        <div class="toolbar-group">
            <div class="toolbar-title">Special Khowar Glyphs (Lowercase)</div>
            <div class="glyph-toolbar" id="editorLowercaseToolbar"></div>
        </div>

        <div class="toolbar-group">
            <div class="toolbar-title">Special Khowar Glyphs (Uppercase)</div>
            <div class="glyph-toolbar" id="editorUppercaseToolbar"></div>
        </div>

        <button onclick="generateEmbedCode()" class="glyph-card" style="width: auto; padding: 0.7rem 1.5rem; background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer;">
            📋 Generate Website Embed Code
        </button>

        <div class="output-title" id="outputTitle">Ready-to-use HTML Embed Snippet:</div>
        <div class="output-box" id="embedOutput"></div>
    </div>
</div>

<!-- Character Maps & Script Definition -->
<script src="js/glyphs.js"></script>
<script src="js/script.js"></script>
<script src="js/formatter.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
    // Helper function to resolve a token (e.g. "[ch]" or "a") to its output character/glyph
    function resolveGlyphChar(token, isUpper = false) {
        if (typeof khowarGlyphs !== "undefined") {
            const map = isUpper ? khowarGlyphs.uppercase : khowarGlyphs.lowercase;
            if (map && map[token]) {
                return map[token]; // Returns PUA character like '\uE001'
            }
        }
        return token; // Returns standard character like 'a'
    }

    // Populate Full Lowercase Alphabet Toolbar
    const lowerContainer = document.getElementById("editorLowercaseToolbar");
    if (lowerContainer && typeof khowarScript !== "undefined" && khowarScript.lowercase) {
        lowerContainer.innerHTML = ""; // Clear existing toolbar buttons
        khowarScript.lowercase.forEach((token) => {
            const charToInsert = resolveGlyphChar(token, false);
            const btn = document.createElement("button");
            btn.className = "glyph-btn khowar-font";
            btn.textContent = charToInsert;
            btn.title = token; // Hover shows token representation (e.g., "[ch]", "a")
            btn.onclick = () => insertAtCursor(charToInsert);
            lowerContainer.appendChild(btn);
        });
    }

    // Populate Full Uppercase Alphabet Toolbar
    const upperContainer = document.getElementById("editorUppercaseToolbar");
    if (upperContainer && typeof khowarScript !== "undefined" && khowarScript.uppercase) {
        upperContainer.innerHTML = ""; // Clear existing toolbar buttons
        khowarScript.uppercase.forEach((token) => {
            const charToInsert = resolveGlyphChar(token, true);
            const btn = document.createElement("button");
            btn.className = "glyph-btn khowar-font";
            btn.textContent = charToInsert;
            btn.title = token; // Hover shows token representation (e.g., "[Ch]", "A")
            btn.onclick = () => insertAtCursor(charToInsert);
            upperContainer.appendChild(btn);
        });
    }
});

    function insertAtCursor(char) {
        const textarea = document.getElementById("editorInput");
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = textarea.value;

        textarea.value = text.substring(0, start) + char + text.substring(end);
        textarea.focus();
        textarea.selectionStart = textarea.selectionEnd = start + char.length;
    }

    function generateEmbedCode() {
        const textValue = document.getElementById("editorInput").value;
        if (!textValue.trim()) {
            alert("Please enter some Khowar text before generating the embed code.");
            return;
        }

        const currentDomain = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));

        const embedSnippet = `<link rel="stylesheet" href="${currentDomain}/css/style.css">
        <div class="khowar-font" style="font-size: 1.5rem; line-height: 1.8;">
        ${textValue.replace(/\n/g, '<br>')}
        </div>`;

        const outputBox = document.getElementById("embedOutput");
        const outputTitle = document.getElementById("outputTitle");

        outputBox.textContent = embedSnippet;
        outputBox.style.display = "block";
        outputTitle.style.display = "block";

        navigator.clipboard.writeText(embedSnippet).then(() => {
            alert("Embed code generated and copied to clipboard successfully!");
        });
    }
</script>

</body>
</html>
