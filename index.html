<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="Khowar Language Translator & Open Learning Engine">
    <meta name="description" content="Translate English to Khowar and explore the indigenous language of Chitral, Ghizer, Gilgit, Hunza, Baltistan, Wakhan, and Tajikistan. Features custom glyph font rendering, interactive audio pronunciations, and an open Khowar Dictionary.">
    <meta name="keywords" content="Khowar, Chitral, Khowar language, Khowar dictionary, Kho people, Dardic languages, Khowar font, Khowar translator, Gilgit, Ghizer, Hunza, Wakhan, Hindukush languages">
    <meta name="author" content="Open Khowar Project">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ektishaf.com/khowar.github.io/">
    <meta property="og:title" content="Khowar Language Translator & Open Learning Engine">
    <meta property="og:description" content="Interactive translation engine, letter audio pronunciations, and an open dictionary for Khowar — the core indigenous language of Chitral and surrounding high-mountain regions.">
    <meta property="og:image" content="https://img.youtube.com/vi/2SWx2Jb7a_g/maxresdefault.jpg">

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://ektishaf.com/khowar.github.io/">
    <meta property="twitter:title" content="Khowar Language Translator & Open Learning Engine">
    <meta property="twitter:description" content="Learn and translate Khowar with custom font glyph rendering, audio pronunciations, and dynamic dictionary datasets.">
    <meta property="twitter:image" content="https://img.youtube.com/vi/2SWx2Jb7a_g/maxresdefault.jpg">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
 <div class="brand">Khowar</div>
    <nav>
        <a href="editor.html" style="color: var(--accent); text-decoration: none; font-weight: 600; padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); margin-right: 8px;">Editor</a>
        <a href="dictionary.html" style="color: var(--accent); text-decoration: none; font-weight: 600; padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg);">Dictionary</a>
    </nav>
 <select id="langSelect" style="width: auto;">
 <option value="en">English Version</option>
<option value="kh">Khowar Version</option>
  </select>
 </header>
 <div class="container">
        <!-- Translator Section -->
        <div class="card">
            <h2 id="transTitle">Khowar Translator</h2>
            <div class="search-controls">
                <input type="text" id="searchInput" placeholder="Type 'house', 'water', or click a character below...">
                <select id="directionSelect" style="width: auto;">
                    <option value="en-to-kh">English ➔ Khowar</option>
                    <option value="kh-to-en">Khowar ➔ English</option>
                </select>
            </div>
            <!-- Unique Result Box -->
            <div class="result-box khowar-font" id="translationOutput">
                <span style="color: var(--text-muted); font-size: 1rem;" id="outputText">Translation output will appear here...</span>
            </div>
        </div>

        <!-- Audio Playback Control -->
        <button onclick="playTranslationOutput()" class="glyph-card" style="margin-top: 10px; width: auto; padding: 0.5rem 1rem;">
            🔊 Listen
        </button>

 <!-- Lowercase Khowar Alphabet -->
<div class="card">
 <h3 class="section-title">Khowar Alphabet (Lowercase)</h3>
 <div class="grid" id="khowarLowercaseContainer"></div>
 </div>

 <!-- Uppercase Khowar Alphabet -->
 <div class="card">
 <h3 class="section-title">Khowar Alphabet (Uppercase)</h3>
 <div class="grid" id="khowarUppercaseContainer"></div>
 </div>

 <!-- Special Khowar Letters (Lowercase PUA Glyphs) -->
 <div class="card">
 <h3 class="section-title" id="specialLowerTitle">Special Khowar Letters (Lowercase)</h3>
 <div class="grid" id="specialLowercaseContainer"></div>
 </div>

 <!-- Special Khowar Letters (Uppercase PUA Glyphs) -->
 <div class="card">
 <h3 class="section-title" id="specialUpperTitle">Special Khowar Letters (Uppercase)</h3>
 <div class="grid" id="specialUppercaseContainer"></div>
 </div>
</div>

 <!-- Character mappings & Script Definition -->
 <!-- Character Maps & Script Definition -->
 <script src="js/glyphs.js"></script>
<script src="js/script.js"></script>

 <!-- Modular Data Files -->
 <script src="data/nouns.js"></script>
 <script src="data/verbs.js"></script>
 <script src="data/pronouns.js"></script>
 <script src="data/prepositions.js"></script>
 <script src="data/sentences.js"></script>
<script src="data/conjunctions.js"></script>
<script src="data/adjectives.js"></script>
<script src="data/adverbs.js"></script>
<script src="data/possessives.js"></script>

 <!-- Modular Utilities Engine -->
<script src="js/formatter.js"></script>
<script src="js/audio.js"></script>
<script src="engines/countingEngine.js"></script>
<script src="engines/reverseCountingEngine.js"></script>
<script src="engines/tensesEngine.js"></script>
<script src="engines/imperativeEngine.js"></script>
<script src="engines/compoundEngine.js"></script>
<script src="engines/interrogativeEngine.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
