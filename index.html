<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khowar Language Portal & Translator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
 <div class="brand">Khowar Simplified</div>
 <select id="langSelect" style="width: auto;">
 <option value="en">English Version</option>
<option value="kh">Khowar Version</option>
  </select>
 </header>
 <div class="container">
        <!-- Translator Section -->
        <div class="card">
            <h2 id="transTitle">Khowar Translator</h2>
            <div class="search-controls">
                <input type="text" id="searchInput" placeholder="Type 'house', 'water', or click a character below...">
                <select id="directionSelect" style="width: auto;">
                    <option value="en-to-kh">English ➔ Khowar</option>
                    <option value="kh-to-en">Khowar ➔ English</option>
                </select>
            </div>
            <!-- Unique Result Box -->
            <div class="result-box khowar-font" id="translationOutput">
                <span style="color: var(--text-muted); font-size: 1rem;" id="outputText">Translation output will appear here...</span>
            </div>
        </div>

        <!-- Audio Playback Control -->
        <button onclick="playTranslationOutput()" class="glyph-card" style="margin-top: 10px; width: auto; padding: 0.5rem 1rem;">
            🔊 Listen
        </button>

 <!-- Lowercase Khowar Alphabet -->
<div class="card">
 <h3 class="section-title">Khowar Alphabet (Lowercase)</h3>
 <div class="grid" id="khowarLowercaseContainer"></div>
 </div>

 <!-- Uppercase Khowar Alphabet -->
 <div class="card">
 <h3 class="section-title">Khowar Alphabet (Uppercase)</h3>
 <div class="grid" id="khowarUppercaseContainer"></div>
 </div>

 <!-- Special Khowar Letters (Lowercase PUA Glyphs) -->
 <div class="card">
 <h3 class="section-title" id="specialLowerTitle">Special Khowar Letters (Lowercase)</h3>
 <div class="grid" id="specialLowercaseContainer"></div>
 </div>

 <!-- Special Khowar Letters (Uppercase PUA Glyphs) -->
 <div class="card">
 <h3 class="section-title" id="specialUpperTitle">Special Khowar Letters (Uppercase)</h3>
 <div class="grid" id="specialUppercaseContainer"></div>
 </div>
</div>

 <!-- Character mappings & Script Definition -->
 <!-- Character Maps & Script Definition -->
 <script src="js/glyphs.js"></script>
<script src="js/script.js"></script>

 <!-- Modular Data Files -->
 <script src="data/nouns.js"></script>
 <script src="data/verbs.js"></script>
 <script src="data/pronouns.js"></script>
 <script src="data/prepositions.js"></script>
 <script src="data/sentences.js"></script>

 <!-- Modular Utilities Engine -->
<script src="js/formatter.js"></script>
<script src="js/audio.js"></script>
<script src="js/translator.js"></script>
<script src="js/app.js"></script>
</body>
</html>
